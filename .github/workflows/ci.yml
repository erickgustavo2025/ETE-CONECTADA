name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feature/**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build dos dois apps
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Conferir tipos dos dois apps
        run: npm run typecheck

      - name: Conferir lint
        run: npm run lint

      - name: Conferir formatação dos arquivos alterados
        run: npm run format:check
        env:
          FORMAT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Testar validações puras e guardas
        run: |
          npm run test:unit
          npm run test:guards

      - name: Compilar portal e site
        run: npm run build

  migrations:
    name: Migrações e integração em PostgreSQL descartável
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_DB_CONTAINER: ete-test-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Preparar banco novo e identificado
        id: database
        run: bash .github/scripts/start-test-db.sh

      - name: Validar modelo e aplicar migrações
        run: |
          npm run db:validate --workspace @ete-conectada/portal
          npm run db:migrate --workspace @ete-conectada/portal
          npm run db:status --workspace @ete-conectada/portal
          npm run test:schema

      - name: Conferir reexecução sem migrações pendentes
        run: |
          npm run db:migrate --workspace @ete-conectada/portal
          npm run test:schema

      - name: Gerar cliente Prisma para os testes
        id: generate
        run: npm run db:generate --workspace @ete-conectada/portal

      - name: Testar cadastro, declaração, sessão, produção e banco em sequência
        run: npm run test:integration
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Conferir limpeza dos registros sintéticos
        if: always() && steps.database.outcome == 'success' && steps.generate.outcome == 'success'
        run: npm run test:cleanup

      - name: Remover somente o banco desta execução
        if: always()
        run: |
          if docker container inspect "$TEST_DB_CONTAINER" >/dev/null 2>&1; then
            docker rm --force "$TEST_DB_CONTAINER"
          fi
