name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feature/**', 'codex/**']

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    name: Validar workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Conferir YAML, expressões e comandos
        run: bash .github/scripts/check-workflows.sh

  build:
    name: Build dos dois apps
    needs: workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # PRs executam código sob revisão; só pushes alimentam o cache npm.
          cache: ${{ github.event_name == 'push' && 'npm' || '' }}
          package-manager-cache: false
          cache-dependency-path: package-lock.json

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Conferir tipos dos dois apps
        run: npm run typecheck

      - name: Conferir lint
        run: npm run lint

      - name: Conferir formatação dos arquivos alterados
        run: npm run format:check
        env:
          FORMAT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Testar validações puras e guardas
        run: |
          npm run test:unit
          npm run test:guards

      - name: Compilar portal e site
        run: npm run build

  migrations:
    name: Migrações e integração em PostgreSQL descartável
    needs: workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    env:
      TEST_DB_CONTAINER: ete-test-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # PRs executam código sob revisão; só pushes alimentam o cache npm.
          cache: ${{ github.event_name == 'push' && 'npm' || '' }}
          package-manager-cache: false
          cache-dependency-path: package-lock.json

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Preparar banco novo e identificado
        id: database
        run: bash .github/scripts/start-test-db.sh

      - name: Validar modelo e aplicar migrações
        run: |
          npm run db:validate --workspace @ete-conectada/portal
          npm run db:migrate --workspace @ete-conectada/portal
          npm run db:status --workspace @ete-conectada/portal
          npm run test:schema

      - name: Conferir reexecução sem migrações pendentes
        run: |
          npm run db:migrate --workspace @ete-conectada/portal
          npm run test:schema

      - name: Gerar cliente Prisma para os testes
        id: generate
        run: npm run db:generate --workspace @ete-conectada/portal

      - name: Testar importação, cadastro, declaração, sessão, produção e banco em sequência
        run: npm run test:integration
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Instalar Chromium para os testes de navegador
        run: npm exec --workspace @ete-conectada/portal -- playwright install --with-deps chromium

      - name: Testar jornadas em navegador com dados sintéticos
        run: npm run test:browser
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Conferir limpeza dos registros sintéticos
        if: always() && steps.database.outcome == 'success' && steps.generate.outcome == 'success'
        run: npm run test:cleanup

      - name: Remover somente o banco desta execução
        if: always()
        run: |
          if docker container inspect "$TEST_DB_CONTAINER" >/dev/null 2>&1; then
            docker rm --force "$TEST_DB_CONTAINER"
          fi
