name: Imagens Docker

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feature/**']
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    name: Construir e testar site e portal
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Conferir workflow
        run: bash .github/scripts/check-workflows.sh .github/workflows/images.yml
      - name: Instalar ferramentas de teste pelo lockfile
        run: npm ci --ignore-scripts
      - name: Conferir condições e integridade do artefato com fixtures
        run: |
          node scripts/test-release-gates.mjs
          python3 scripts/test-release-artifact.py
      - name: Instalar Chromium no runner de teste
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Preparar destino temporário exclusivo do pacote
        id: package_request
        run: node scripts/release-gates.mjs request
      - name: Construir e testar imagens sem registry ou deploy
        run: bash .github/scripts/test-containers.sh
      - name: Ensaiar Compose e persistência em laboratório próprio
        run: bash .github/scripts/test-compose-lab.sh
      - name: Exigir CI e segurança do mesmo commit antes de liberar pacote
        if: steps.package_request.outputs.package == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-gates.mjs
          python3 scripts/release-artifact.py seal "$TEST_IMAGE_OUTPUT_DIR" "$GITHUB_SHA" "$GITHUB_REPOSITORY"
          python3 scripts/release-artifact.py verify "$TEST_IMAGE_OUTPUT_DIR" "$GITHUB_SHA"
      - name: Guardar pacote de ensaio identificado sem publicar em registry
        if: steps.package_request.outputs.package == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: imagens-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.TEST_IMAGE_OUTPUT_DIR }}/site.tar.gz
            ${{ env.TEST_IMAGE_OUTPUT_DIR }}/portal.tar.gz
            ${{ env.TEST_IMAGE_OUTPUT_DIR }}/site-audit.json
            ${{ env.TEST_IMAGE_OUTPUT_DIR }}/portal-audit.json
            ${{ env.TEST_IMAGE_OUTPUT_DIR }}/release.json
            ${{ env.TEST_IMAGE_OUTPUT_DIR }}/SHA256SUMS
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
          compression-level: 0
          retention-days: 3
