version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Fortaleza
    open-pull-requests-limit: 3
    groups:
      next:
        patterns:
          - next
          - '@next/*'
      prisma:
        patterns:
          - prisma
          - '@prisma/*'
    commit-message:
      prefix: chore(deps)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Fortaleza
    open-pull-requests-limit: 2
    commit-message:
      prefix: ci(deps)
