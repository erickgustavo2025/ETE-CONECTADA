# Laboratório sintético. Hosting, recursos e persistência de produção seguem EC050.
services:
  site:
    image: ${ETE_LAB_SITE_IMAGE:-ete-site:lab}
    build:
      context: .
      target: site
      args:
        NEXT_PUBLIC_PORTAL_LOGIN_URL: ${ETE_LAB_PORTAL_LOGIN_URL:-https://portal.example.invalid/login}
      labels:
        ete.test.id: ${ETE_LAB_RUN_ID:?Informe identificador exclusivo do laboratório}
    labels:
      ete.test.id: ${ETE_LAB_RUN_ID:?}
    user: '1000:1000'
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: 1
    pids_limit: 128
    restart: unless-stopped
    stop_grace_period: 30s
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,uid=1000,gid=1000,mode=0700
      - /app/apps/site/.next/cache:rw,noexec,nosuid,nodev,size=64m,uid=1000,gid=1000,mode=0700
    environment:
      SITE_PUBLIC_URL: https://site.example.invalid
    ports:
      - '127.0.0.1:${ETE_LAB_SITE_PORT:-3100}:3000'
    networks: [web]
  portal:
    image: ${ETE_LAB_PORTAL_IMAGE:-ete-portal:lab}
    build:
      context: .
      target: portal
      labels:
        ete.test.id: ${ETE_LAB_RUN_ID:?}
    labels:
      ete.test.id: ${ETE_LAB_RUN_ID:?}
    user: '1000:1000'
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: 1
    pids_limit: 128
    restart: unless-stopped
    stop_grace_period: 30s
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,uid=1000,gid=1000,mode=0700
      - /app/apps/portal/.next/cache:rw,noexec,nosuid,nodev,size=64m,uid=1000,gid=1000,mode=0700
    environment:
      PORTAL_PUBLIC_URL: https://portal.example.invalid
      DATABASE_URL_FILE: /run/secrets/portal_database_url
    secrets: [portal_database_url]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:${ETE_LAB_PORTAL_PORT:-3101}:3000'
    networks: [web, database]
  db:
    image: postgres:16.15-alpine3.24@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    labels:
      ete.test.id: ${ETE_LAB_RUN_ID:?}
    user: '70:70'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    restart: unless-stopped
    stop_grace_period: 30s
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,uid=70,gid=70,mode=0700
      - /var/run/postgresql:rw,noexec,nosuid,nodev,size=8m,uid=70,gid=70,mode=0770
    environment:
      POSTGRES_DB: ete_lab
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets: [database_password]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [database]
networks:
  web:
    labels:
      ete.test.id: ${ETE_LAB_RUN_ID:?}
  database:
    internal: true
    labels:
      ete.test.id: ${ETE_LAB_RUN_ID:?}
volumes:
  postgres_data:
    labels:
      ete.test.id: ${ETE_LAB_RUN_ID:?}
secrets:
  database_password:
    file: ${ETE_LAB_DB_PASSWORD_FILE:?Informe caminho externo da senha fictícia}
  portal_database_url:
    file: ${ETE_LAB_DATABASE_URL_FILE:?Informe caminho externo da conexão fictícia}
